# Gerald's existing Vercel GitHub integration publishes pushes to main.
# CI verifies the source. A VERCEL_TOKEN enables optional explicit CLI releases.
name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after checks (false runs production preflight only)
        type: boolean
        default: false

# One deploy at a time; a newer push waits for the current one to finish.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_YfLkM1POJwWxWzlQca1W2A5l
      VERCEL_PROJECT_ID: prj_2R7l9Fvg6cBUxlqKlGFzS5Txqm7x
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate production build
        run: npm run build

      - name: Existing GitHub deployment connection
        if: env.VERCEL_TOKEN == ''
        run: echo "Gerald's existing Vercel GitHub integration deploys main to oliverfee360.com; no separate CLI credential is required."

      - name: Verify repository, Vercel project and production domain
        if: env.VERCEL_TOKEN != ''
        run: node scripts/verify-release-target.mjs

      - name: Pull production settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@65.14.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify owner and configure isolated admin storage
        if: env.VERCEL_TOKEN != ''
        env:
          ADMIN_RELEASE_OWNER_IDS: ${{ vars.OLIVERFEE_OWNER_IDS }}
        run: node scripts/configure-admin-production.mjs

      - name: Refresh verified production settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@65.14.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@65.14.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        if: env.VERCEL_TOKEN != '' && (github.event_name == 'push' || inputs.deploy)
        run: npx --yes vercel@65.14.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
